<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIYVM password form compatibility checks</title>
    <style>
      body {
        margin: 2rem auto;
        max-width: 52rem;
        padding: 0 1.5rem;
        font-family: system-ui, sans-serif;
      }

      form,
      [role="dialog"],
      #shadow-host {
        display: grid;
        gap: 0.75rem;
        margin-block: 1rem;
        padding: 1rem;
        border: 1px solid #94a3b8;
      }

      [role="dialog"] {
        position: fixed;
        z-index: 20;
        inset: 15% 20% auto;
        background: white;
        box-shadow: 0 1rem 4rem rgb(15 23 42 / 35%);
      }

      input {
        min-height: 2.5rem;
      }

      [data-status="passed"] {
        color: #15803d;
      }

      [data-status="failed"] {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>密码弹窗兼容测试</h1>
    <p id="status" data-status="running">正在运行…</p>
    <ol id="results"></ol>
    <main id="fixture"></main>
    <script type="module" src="./password-form-harness.js"></script>
  </body>
</html>
