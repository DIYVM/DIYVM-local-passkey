name: Build and Release Chrome Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    name: Check, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Create installable ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./extension/package.json').version")"
          ARCHIVE="DIYVM-Local-Passkey-Chrome-${VERSION}.zip"
          mkdir -p artifacts
          (
            cd extension/dist
            zip -q -r "../../artifacts/${ARCHIVE}" .
          )
          (
            cd artifacts
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )
          unzip -tq "artifacts/${ARCHIVE}"
          unzip -Z1 "artifacts/${ARCHIVE}" | grep -qx "manifest.json"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DIYVM-Local-Passkey-Chrome-${{ steps.package.outputs.version }}
          path: |
            artifacts/${{ steps.package.outputs.archive }}
            artifacts/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      ARCHIVE: ${{ needs.build-extension.outputs.archive }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-extension.outputs.version }}

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match extension version ${VERSION}"
            exit 1
          fi

      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: DIYVM-Local-Passkey-Chrome-${{ needs.build-extension.outputs.version }}
          path: release-assets

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/${ARCHIVE}"
          test -f "release-assets/${ARCHIVE}.sha256"
          (
            cd release-assets
            sha256sum -c "${ARCHIVE}.sha256"
          )
          unzip -tq "release-assets/${ARCHIVE}"
          unzip -Z1 "release-assets/${ARCHIVE}" | grep -qx "manifest.json"

      - name: Create GitHub Release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "release-assets/${ARCHIVE}" \
            "release-assets/${ARCHIVE}.sha256" \
            --verify-tag \
            --title "DIYVM Local Passkey ${VERSION}" \
            --generate-notes
