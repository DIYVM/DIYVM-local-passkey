name: Build and Release DIYVM Local Vault

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    name: Check, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build Chrome Web Store package
        run: npm run build:store

      - name: Validate extension metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const rootPackage = require("./package.json");
          const extensionPackage = require("./extension/package.json");
          const manifest = require("./extension/dist/manifest.json");
          const versions = new Set([
            rootPackage.version,
            extensionPackage.version,
            manifest.version
          ]);
          if (versions.size !== 1) {
            throw new Error(
              `Version mismatch: root=${rootPackage.version}, extension=${extensionPackage.version}, manifest=${manifest.version}`
            );
          }
          if (manifest.name !== "DIYVM Local Vault") {
            throw new Error(`Unexpected extension name: ${manifest.name}`);
          }
          if (Object.prototype.hasOwnProperty.call(manifest, "key")) {
            throw new Error("Store manifest must not contain a key");
          }
          NODE
          if find extension/dist -type f -name "*.map" -print -quit | grep -q .; then
            echo "::error::Chrome Web Store build contains source maps"
            exit 1
          fi

      - name: Create Chrome Web Store ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./extension/package.json').version")"
          ARCHIVE="DIYVM-Local-Vault-Chrome-Web-Store-${VERSION}.zip"
          mkdir -p artifacts
          (
            cd extension/dist
            zip -q -X -r "../../artifacts/${ARCHIVE}" .
          )
          (
            cd artifacts
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )
          unzip -tq "artifacts/${ARCHIVE}"
          test "$(unzip -Z1 "artifacts/${ARCHIVE}" | grep -cx "manifest.json")" -eq 1
          if unzip -Z1 "artifacts/${ARCHIVE}" | grep -Eiq \
            '(^|/)(node_modules|src|test)/|\.map$|\.ts$|(^|/)\.env|(^|/).*\.(key|pem|pfx|p12|db|sqlite|sqlite3)$'; then
            echo "::error::Store archive contains source, test, source-map, database, environment, or key files"
            exit 1
          fi
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload tested Chrome Web Store package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DIYVM-Local-Vault-Chrome-Web-Store-${{ steps.package.outputs.version }}
          path: |
            artifacts/${{ steps.package.outputs.archive }}
            artifacts/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      ARCHIVE: ${{ needs.build-extension.outputs.archive }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-extension.outputs.version }}

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match extension version ${VERSION}"
            exit 1
          fi

      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: DIYVM-Local-Vault-Chrome-Web-Store-${{ needs.build-extension.outputs.version }}
          path: release-assets

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/${ARCHIVE}"
          test -f "release-assets/${ARCHIVE}.sha256"
          (
            cd release-assets
            sha256sum -c "${ARCHIVE}.sha256"
          )
          unzip -tq "release-assets/${ARCHIVE}"
          test "$(unzip -Z1 "release-assets/${ARCHIVE}" | grep -cx "manifest.json")" -eq 1
          if unzip -Z1 "release-assets/${ARCHIVE}" | grep -Eiq \
            '(^|/)(node_modules|src|test)/|\.map$|\.ts$|(^|/)\.env|(^|/).*\.(key|pem|pfx|p12|db|sqlite|sqlite3)$'; then
            echo "::error::Release archive contains forbidden files"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "release-assets/${ARCHIVE}" \
            "release-assets/${ARCHIVE}.sha256" \
            --verify-tag \
            --title "DIYVM Local Vault ${VERSION}" \
            --generate-notes
